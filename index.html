<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Iron Log</title>
<meta name="description" content="Workout tracker with templates, rest timers, progression targets and weekly volume per muscle.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Iron Log">
<meta name="theme-color" content="#05060a">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>html{background:#05060a}body{-webkit-user-select:none;user-select:none}input,textarea{-webkit-user-select:text;user-select:text}</style>
</head>
<body>
<style>
/* Layout: iOS-style tab app — scrolling tab views over a fixed dark tab bar, page sheets stacked on top. */
/* Layout: dark Liquid Glass — content scrolls over an ambient glow; floating glass tab bar, glass sheets and capsule controls. Single dark theme by design. */
:root{
  --bg:#05060a; --bg2:rgba(255,255,255,.05); --fill:rgba(255,255,255,.08); --fill2:rgba(255,255,255,.16); --fg:#f5f5f7; --fg2:rgba(235,235,245,.62); --fg3:rgba(235,235,245,.32); --sep:rgba(255,255,255,.08); --line:rgba(255,255,255,.13);
  --accent:#0a84ff; --accent-soft:rgba(10,132,255,.2); --green:#30d158; --green-soft:rgba(48,209,88,.16); --red:#ff453a; --red-soft:rgba(255,69,58,.16);
  --purple:#bf5af2; --purple-soft:rgba(191,90,242,.2); --orange:#ff9f0a; --orange-soft:rgba(255,159,10,.18); --gold:#ffd60a;
  --tab:rgba(28,30,40,.42); --tabfg:rgba(235,235,245,.6); --tabon:#ffffff; --scrim:rgba(0,0,0,.5); --sheet:rgba(24,26,34,.58); --cut:#10121a;
  --glass:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.04) 45%,rgba(255,255,255,.07));
  --rim:inset 0 1px 0 rgba(255,255,255,.24),inset 0 -1px 0 rgba(255,255,255,.05),inset 0 0 0 .5px rgba(255,255,255,.14);
  --lift:0 10px 34px rgba(0,0,0,.42);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px); --tabh:calc(70px + var(--sb));
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:16px/1.3 var(--font);overflow:hidden;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}
.ic svg,.ico{width:22px;height:22px}
b,strong{font-weight:600}

/* ---------- views ---------- */
#views{position:fixed;left:0;right:0;top:var(--st);bottom:var(--tabh);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px 24px;overscroll-behavior:contain}
#views.has-mini{bottom:calc(var(--tabh) + 66px)}
.nav{display:flex;align-items:center;justify-content:space-between;min-height:40px;gap:12px}
.nav .l,.nav .r{display:flex;gap:16px;align-items:center;color:var(--accent);min-width:44px}
.nav .r{justify-content:flex-end}
.nav .ic{color:var(--accent);padding:6px}
.lt{font-size:32px;font-weight:700;letter-spacing:-.4px;margin:4px 0 14px;text-wrap:balance}
.h2{font-size:22px;font-weight:700;letter-spacing:-.2px}
.sec-row{display:flex;align-items:center;gap:8px;margin:22px 0 12px}
.sec-row .grow{flex:1}
.sub-row{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px;font-size:17px;font-weight:600}
.lbl{font-size:16px;font-weight:600;margin:4px 0 12px}
.muted{color:var(--fg2)}
.pill{background:var(--accent-soft);color:var(--accent);border-radius:9px;padding:6px 10px;font-size:15px;font-weight:500;display:inline-flex;align-items:center;gap:4px;min-height:32px}
.pill.ic{padding:5px 8px}
.pill svg{width:18px;height:18px}
.primary{display:block;width:100%;background:var(--accent);color:#fff;border-radius:10px;padding:12px;font-size:17px;font-weight:600;text-align:center}
.primary:active{filter:brightness(.92)}
.wide{display:block;width:100%;border-radius:9px;padding:10px;font-size:16px;font-weight:600;text-align:center;margin-top:12px}
.soft-blue{background:var(--accent-soft);color:var(--accent)}
.soft-red{background:var(--red-soft);color:var(--red)}
.soft-grey{background:var(--fill);color:var(--fg)}
.btn{border-radius:8px;padding:7px 16px;font-size:16px;font-weight:600}
.btn.blue{background:var(--accent);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.dis{opacity:.4;pointer-events:none}
.xbtn{width:44px;height:34px;border-radius:9px;background:var(--fill);display:grid;place-items:center}
.xbtn svg{width:16px;height:16px}
.link{color:var(--accent);font-size:17px}
.link.dis{color:var(--fg3);pointer-events:none}

/* template cards */
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tcard{border:1px solid var(--line);border-radius:12px;padding:12px 12px 12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0;background:var(--bg)}
.tcard:active{background:var(--bg2)}
.tcard .th{display:flex;gap:6px;align-items:flex-start;justify-content:space-between}
.tcard .tn{font-size:17px;font-weight:600;line-height:1.2;overflow-wrap:break-word;min-width:0}
.tcard .tx{color:var(--fg2);font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.tcard .tl{color:var(--fg2);font-size:14px;font-style:italic;display:flex;align-items:center;gap:5px;margin-top:auto;padding-top:4px}
.tcard .tl svg{width:13px;height:13px;flex:none}
.dots{background:var(--accent-soft);color:var(--accent);border-radius:7px;width:34px;height:24px;display:grid;place-items:center;flex:none}
.dots svg{width:18px;height:18px}
.empty{color:var(--fg2);text-align:center;padding:26px 12px;font-size:15px;line-height:1.45}
.empty b{display:block;color:var(--fg);font-size:17px;margin-bottom:4px}
.tsearch{width:100%;border:0;border-radius:10px;background:var(--fill);padding:9px 12px;margin-bottom:6px;outline:none}

/* exercise list */
.exhead{position:sticky;top:-6px;background:var(--bg);z-index:3;padding-top:2px;margin:0 -16px;padding-left:16px;padding-right:16px}
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:10px;padding:0 10px;height:38px}
.search svg{width:18px;height:18px;color:var(--fg2);flex:none}
.search input{flex:1;border:0;background:none;outline:none;min-width:0;font-size:17px}
.filters{display:flex;gap:8px;margin:10px 0 6px}
.filters button{flex:1;background:var(--fill);border-radius:8px;height:34px;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
.filters button.on{background:var(--accent);color:#fff}
.filters .sortb{flex:0 0 52px;display:grid;place-items:center}
.filters .sortb svg{width:20px;height:20px}
.exlist{position:relative;padding-right:18px}
.lsec{position:sticky;top:var(--lsec-top,0px);z-index:2;background:var(--bg);font-size:17px;font-weight:500;color:var(--fg2);padding:10px 0 6px;border-bottom:1px solid var(--sep)}
.exrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--sep);width:100%;text-align:left;cursor:pointer}
.exrow:active{background:var(--bg2)}
.exrow.sel{background:var(--accent-soft);margin:0 -16px;padding-left:16px;padding-right:16px;width:calc(100% + 32px)}
.thumb{width:52px;height:52px;flex:none;display:grid;place-items:center;font-size:36px;font-weight:800;color:var(--fg);position:relative;letter-spacing:-1px}
.thumb .ck{position:absolute;inset:6px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center}
.thumb .ck svg{width:22px;height:22px}
.exmid{flex:1;min-width:0}
.exmid b{display:block;font-size:17px;font-weight:600;line-height:1.2}
.exmid .sub{display:flex;justify-content:space-between;gap:8px;color:var(--fg2);font-size:16px;margin-top:3px}
.exmid .sub span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.q{width:36px;height:32px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-size:20px;font-weight:500;flex:none}
.az{position:absolute;right:-20px;top:0;width:22px;display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:600;color:var(--accent);touch-action:none;z-index:4}
.az span{display:block;line-height:16px;width:22px;text-align:center}
.azwrap{position:sticky;top:150px;height:0;z-index:4}
.sh-body .azwrap{top:10px}

/* history */
.mhead{font-size:13px;font-weight:600;letter-spacing:.6px;color:var(--fg2);text-transform:uppercase;margin:20px 0 10px}
.wcard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;display:block;width:100%;text-align:left}
.wcard:active{background:var(--bg2)}
.wcard .wh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wcard .wn{font-size:18px;font-weight:600}
.wcard .wd{color:var(--fg2);font-size:15px;margin:2px 0 8px}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:15px;margin-bottom:10px}
.stats span{display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.stats svg{width:16px;height:16px;color:var(--fg2)}
.stats .gold svg{color:var(--gold)}
.bs{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;font-size:15px}
.bs .hd{font-weight:600}
.bs .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg2)}
.bs .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--fg2)}

/* profile */
.ucard{display:flex;align-items:center;gap:14px;padding:6px 0 16px;width:100%;text-align:left}
.avatar{width:62px;height:62px;border-radius:50%;background:var(--fill);display:grid;place-items:center;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar svg{width:30px;height:30px}
.ucard .un{font-size:19px;font-weight:600}
.ucard .chev{margin-left:auto;color:var(--accent)}
.wid{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.wid .wt{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.wid .wt b{font-size:18px}
.wid .wt .muted{font-size:14px;margin-top:2px}
.chart{width:100%;height:auto;margin-top:8px;overflow:visible}
.chart text{fill:var(--fg2);font:12px var(--font)}
.chart .grid{stroke:var(--sep);stroke-width:1}
.chart .bar{fill:var(--purple)}
.chart .ln{stroke:var(--purple);stroke-opacity:.45;stroke-width:1.5;fill:none}
.chart .pt{fill:var(--bg);stroke:var(--purple);stroke-width:2}
.chart .pt.last{fill:var(--purple)}
.chart .area{fill:var(--purple);fill-opacity:.08}
.nochart{color:var(--fg2);font-size:14px;padding:22px 0;text-align:center}

/* measure */
.grp{font-size:13px;font-weight:600;letter-spacing:.6px;color:var(--fg2);text-transform:uppercase;margin:18px 0 6px}
.mrow{display:flex;align-items:center;justify-content:space-between;width:100%;padding:13px 0;border-bottom:1px solid var(--sep);font-size:17px;text-align:left}
.mrow .v{color:var(--fg2);display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.mrow .v svg{width:14px;height:14px;color:var(--fg3)}

/* tab bar + mini */
#tabs{position:fixed;left:0;right:0;bottom:0;height:var(--tabh);padding-bottom:var(--sb);background:var(--tab);display:flex;z-index:20}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--tabfg);font-size:10.5px;font-weight:500}
#tabs button svg{width:27px;height:27px}
#tabs button.on{color:var(--tabon)}
#mini{position:fixed;left:0;right:0;bottom:var(--tabh);height:66px;background:var(--bg);border-top:1px solid var(--sep);border-radius:12px 12px 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.08);z-index:19;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:100%}
#mini .grab{width:36px;height:5px;border-radius:3px;background:var(--fill2);margin-bottom:5px}
#mini b{font-size:17px}
#mini span{color:var(--fg2);font-size:15px;font-variant-numeric:tabular-nums}
#mini .rt{color:var(--accent);font-weight:600}

/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;transition:opacity .25s;z-index:30}
.scrim.in{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;top:calc(var(--st) + 12px + var(--d,0) * 10px);background:var(--sheet);border-radius:14px 14px 0 0;z-index:31;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.25,1);box-shadow:0 -2px 20px rgba(0,0,0,.12)}
.sheet.in{transform:none}
.sheet.closing{transform:translateY(105%)}
.sheet.short{top:auto;max-height:calc(100% - var(--st) - 40px)}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px 10px;flex:none;position:relative}
.sh-head .tt{font-size:17px;font-weight:600;text-align:center;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-head .side{min-width:60px;display:flex;align-items:center;gap:14px}
.sh-head .side.r{justify-content:flex-end}
.sh-head .grab{position:absolute;left:50%;top:6px;transform:translateX(-50%);width:36px;height:5px;border-radius:3px;background:var(--fill2)}
.sh-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px calc(28px + var(--sb));overscroll-behavior:contain}
.sh-foot{flex:none;padding:10px 16px calc(12px + var(--sb));border-top:1px solid var(--sep)}
.sh-sub{padding:0 16px 8px;flex:none}

/* workout editor */
.wtop{display:flex;align-items:center;gap:10px;margin:8px 0 6px}
.wtitle{flex:1;min-width:0;font-size:24px;font-weight:700;border:0;background:none;outline:none;padding:2px 0;letter-spacing:-.3px}
.wtitle::placeholder{color:var(--fg3)}
.wmeta{display:flex;align-items:center;gap:8px;color:var(--fg2);font-size:16px;margin:4px 0;font-variant-numeric:tabular-nums}
.wmeta svg{width:18px;height:18px}
.notes{width:100%;border:0;border-radius:9px;background:var(--fill);padding:9px 11px;margin:8px 0 0;resize:none;outline:none;font-size:15px;min-height:40px}
.block{margin-top:22px;position:relative}
.block.ss{padding-left:10px}
.block.ss::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:4px;border-radius:2px;background:var(--ssc)}
.bh{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bname{flex:1;min-width:0;text-align:left;color:var(--accent);font-size:17px;font-weight:600;line-height:1.25}
.bh .pill{height:28px;min-height:28px;padding:0 8px}
.sg{display:grid;grid-template-columns:34px minmax(0,1fr) repeat(var(--n),62px) 38px;gap:8px;align-items:center}
.sg.hd{font-size:15px;font-weight:600;padding:0 0 6px}
.sg.hd > *{text-align:center}
.sg.hd > :nth-child(2){text-align:center}
.sg.hd svg{width:16px;height:16px;margin:auto}
.swrap{position:relative;overflow:hidden;border-radius:8px}
.sdel{position:absolute;top:0;right:0;bottom:0;width:84px;background:var(--red);color:#fff;font-weight:600;font-size:15px}
.srow{position:relative;background:var(--sheet);padding:4px 0;transition:transform .2s,background-color .2s;touch-action:pan-y}
.srow.done{background:var(--green-soft)}
.sn{height:30px;border-radius:7px;background:var(--fill);font-weight:600;font-size:15px}
.sn.t-w{color:var(--orange);background:var(--orange-soft)}
.sn.t-d{color:var(--purple);background:var(--purple-soft)}
.sn.t-f{color:var(--red);background:var(--red-soft)}
.srow.done .sn{background:transparent}
.prev{color:var(--fg2);font-size:15px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:30px;font-variant-numeric:tabular-nums}
.prev.none{color:var(--fg3)}
.cell{height:30px;border:0;border-radius:7px;background:var(--fill);text-align:center;font-size:16px;font-weight:600;width:100%;outline:none;min-width:0;font-variant-numeric:tabular-nums;padding:0 2px}
.cell::placeholder{color:var(--fg3);font-weight:500}
.cell:focus{box-shadow:inset 0 0 0 2px var(--fg)}
.srow.done .cell{background:transparent}
.chk{height:30px;border-radius:7px;background:var(--fill);display:grid;place-items:center;color:var(--fg)}
.chk svg{width:18px;height:18px}
.srow.done .chk{background:var(--green);color:#fff}
.chk.na{color:var(--fg3);background:transparent}
.chk.na svg{width:14px}
.restrow{display:flex;align-items:center;gap:8px;height:20px;margin:1px 0}
.restrow::before,.restrow::after{content:"";flex:1;height:3px;border-radius:2px;background:var(--accent-soft)}
.rest{color:var(--accent);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;padding:0 6px;position:relative}
.restrow.run{height:28px}
.restrow.run::before,.restrow.run::after{display:none}
.restrow.run .rest{flex:1;height:26px;border-radius:7px;background:var(--accent-soft);overflow:hidden;color:var(--accent)}
.restrow.run .rest i{position:absolute;left:0;top:0;bottom:0;width:calc(var(--p,1)*100%);background:var(--accent);opacity:.28;transition:width .5s linear}
.restrow.run .rest span{position:relative}
.addset{display:block;width:100%;background:var(--fill);border-radius:8px;height:32px;font-size:15px;font-weight:600;margin-top:8px}
.exnote{width:100%;border:0;border-radius:8px;background:var(--fill);padding:7px 10px;margin:0 0 8px;resize:none;outline:none;font-size:14px;color:var(--fg2)}
.wbar{display:flex;align-items:center;justify-content:space-between;width:100%;padding-top:8px}
.tbtn{min-width:44px;height:34px;border-radius:9px;background:var(--fill);display:grid;place-items:center;padding:0 10px;font-weight:600;font-variant-numeric:tabular-nums}
.tbtn svg{width:20px;height:20px}
.tbtn.run{background:var(--accent);color:#fff}

/* segmented */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:0 0 10px}
.seg button{flex:1;padding:6px 4px;border-radius:7px;font-size:15px;font-weight:600}
.seg button.on{background:var(--sheet);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.media{border:1px solid var(--line);border-radius:14px;height:180px;display:grid;place-items:center;margin:6px 0 18px;background:var(--bg)}
.media .bigl{font-size:96px;font-weight:800;letter-spacing:-3px;line-height:1}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{background:var(--fill);border-radius:8px;padding:5px 10px;font-size:14px;font-weight:600}
.chip.on{background:var(--accent);color:#fff}
h3{font-size:18px;font-weight:700;margin:18px 0 10px}
ol.ins{padding-left:22px;margin:0;display:grid;gap:12px;font-size:16px;line-height:1.45;max-width:65ch}
.card2{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.card2 .t{font-weight:600;font-size:17px}
.card2 .d{color:var(--fg2);font-size:14px;margin:2px 0 8px}
.srow2{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;font-size:15px;padding:3px 0;font-variant-numeric:tabular-nums;align-items:center}
.srow2 .s{font-weight:600;color:var(--fg2)}
.srow2 .s.t-w{color:var(--orange)} .srow2 .s.t-d{color:var(--purple)} .srow2 .s.t-f{color:var(--red)}
.srow2 .r{color:var(--fg2);display:flex;align-items:center;gap:4px}
.srow2 .r svg{width:15px;height:15px;color:var(--gold)}
.rec{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--sep);font-size:16px;gap:12px}
.rec .v{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.rec .v small{display:block;color:var(--fg2);font-weight:400;font-size:13px}
.rtable{display:grid;grid-template-columns:auto 1fr auto;gap:0 12px;font-size:15px;font-variant-numeric:tabular-nums}
.rtable > *{padding:8px 0;border-bottom:1px solid var(--sep)}

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const slug=n=>n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const pad=n=>String(n).padStart(2,'0');
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
const DAY=86400000;
function num(v){if(v==null||v==='')return null;const n=parseFloat(String(v).replace(',','.').replace(/[^\d.\-]/g,''));return isNaN(n)?null:n}
function fN(n){if(n==null||n==='')return '';const r=Math.round(+n*100)/100;return String(r).replace('.',',')}
function fBig(n){return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ')}
function fDur(sec){sec=Math.max(0,Math.round(sec||0));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?`${h}:${pad(m)}:${pad(s)}`:`${m}:${pad(s)}`}
function fHM(ms){const m=Math.max(0,Math.round(ms/60000)),h=Math.floor(m/60);return h?`${h}h ${m%60}m`:`${m}m`}
function parseDur(v){v=String(v??'').trim();if(!v)return null;if(v.includes(':')){const p=v.split(':').map(x=>parseInt(x,10)||0);return p.length>2?p[0]*3600+p[1]*60+p[2]:p[0]*60+p[1]}const d=v.replace(/\D/g,'');if(!d)return null;const n=parseInt(d,10);if(d.length<=2)return n;return Math.floor(n/100)*60+n%100}
function fD(ms){const d=new Date(ms);return `${d.getDate()}. ${d.getMonth()+1}. ${d.getFullYear()}`}
function fDM(ms){const d=new Date(ms);return `${d.getDate()}. ${d.getMonth()+1}`}
function fLong(ms){return new Date(ms).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function fTime(ms){const d=new Date(ms);return `${d.getHours()}:${pad(d.getMinutes())}`}
function sod(ms){const d=new Date(ms);d.setHours(0,0,0,0);return d.getTime()}
function rel(ms){const n=Math.round((sod(Date.now())-sod(ms))/DAY);if(n<=0)return 'Today';if(n===1)return 'Yesterday';if(n<=30)return `${n} days ago`;return fD(ms)}
function mkey(ms){const d=new Date(ms);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`}
function wname(ms){const h=new Date(ms).getHours();return h<5?'Midnight Workout':h<12?'Morning Workout':h<17?'Afternoon Workout':h<21?'Evening Workout':'Night Workout'}
const e1=(kg,r)=>!r||r<=0?0:r===1?kg:kg*(1+r/30);

function subscribe(seed){

 ['profile','templates','custom','active'].forEach(name=>{
  db.doc(B+'/'+name).onSnapshot(snap=>{
   if(snap.metadata.hasPendingWrites)return;
   if(!snap.exists){if(snap.metadata.fromCache||seen[name])return;seen[name]=1;onMissing(name,seed);return}
   seen[name]=1;const d=snap.data();if((d.u||0)<=(S.u[name]||0))return;
   applyRemote(name,d);softRender();
  },e=>console.warn('snapshot',name,e));
 });
 db.doc(B+'/profile').collection('months').onSnapshot(qs=>{
  if(qs.metadata.hasPendingWrites)return;let ch=false;const ids=new Set();
  for(const d of qs.docs){ids.add(d.id);const x=d.data();if((x.u||0)>(S.mu[d.id]||0)){S.months[d.id]={w:clone(x.w||{}),u:x.u};S.mu[d.id]=x.u;ch=true}}

  if(ch){bump();Store.mirror();softRender()}
 },e=>console.warn('months',e));
}

function widget(w,i){

 if(w.type==='ex'){const x=getEx(w.eid);const m=METRICS[kindOf(x)].find(m=>m[0]===w.metric)||METRICS[kindOf(x)][0];return `<div class="wid"><div class="wt"><div><b>${esc(x.name)}</b><div class="muted">${m[1]}</div></div><button class="dots" data-act="widgetMenu" data-arg="${i}" aria-label="Widget options">${IC.dots}</button></div>${lineChart(series(w.eid,m[0]),m[2])}</div>`}
 return '';

function weekChart(){
 const now=new Date();const dow=(now.getDay()+6)%7;const mon=sod(now.getTime())-dow*DAY;const weeks=[];
 for(let i=7;i>=0;i--)weeks.push({s:mon-i*7*DAY,n:0});
 for(const w of W()){const idx=weeks.findIndex(x=>w.start>=x.s&&w.start<x.s+7*DAY);if(idx>=0)weeks[idx].n++}
 const max=Math.max(3,...weeks.map(w=>w.n)),Wd=330,H=150,pl=4,pr=30,pt=12,pb=24,cw=(Wd-pl-pr)/8;
 const y=v=>pt+(H-pt-pb)*(1-v/max);
 let s=`<svg class="chart" viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Workouts per week, last 8 weeks"><line class="grid" x1="${pl}" x2="${Wd-pr}" y1="${y(max)}" y2="${y(max)}" style="stroke:var(--purple);stroke-opacity:.6"/><text x="${Wd-pr+6}" y="${y(max)+4}">${max}</text><line class="grid" x1="${pl}" x2="${Wd-pr}" y1="${y(0)}" y2="${y(0)}"/><text x="${Wd-pr+6}" y="${y(0)+4}">0</text>`;
 weeks.forEach((w,i)=>{const x=pl+cw*i+cw/2;if(w.n)s+=`<rect class="bar" x="${x-7}" y="${y(w.n)}" width="14" height="${y(0)-y(w.n)}" rx="3"><title>${w.n}</title></rect>`;s+=`<text x="${x}" y="${H-6}" text-anchor="middle" style="font-size:11px">${fDM(w.s)}</text>`});
 return s+'</svg>';
}
const METRICS={
 wr:[['e1','Best Set (Est. 1RM)','kg'],['kg','Best Set (Max Weight)','kg'],['vol','Total Volume','kg'],['reps','Total Reps','']],
 pw:[['kg','Max Weight Added','kg'],['mreps','Max Reps',''],['reps','Total Reps','']],
 aw:[['mreps','Max Reps',''],['reps','Total Reps','']],
 r:[['mreps','Max Reps',''],['reps','Total Reps','']],
 t:[['msec','Best Time','s'],['tsec','Total Time','s']],
 c:[['km','Distance','km'],['tsec','Duration','s']],
};
function series(eid,metric){const k=kOf(eid);return sessions(eid).slice().reverse().map(({w,e})=>{const ss=e.sets.filter(s=>s.t!=='w');const sets=ss.length?ss:e.sets;let v=0;
 for(const s of sets){const kg=s.kg||0,r=s.reps||0;switch(metric){case 'e1':v=Math.max(v,e1(kg,r));break;case 'kg':v=Math.max(v,kg);break;case 'vol':v+=kg*r;break;case 'reps':v+=r;break;case 'mreps':v=Math.max(v,r);break;case 'msec':v=Math.max(v,s.sec||0);break;case 'tsec':v+=s.sec||0;break;case 'km':v+=s.km||0;break}}
 return{x:w.start,y:Math.round(v*10)/10}}).filter(p=>p.y>0)}
function niceFmt(v,unit){if(unit==='s')return fDur(v);return fN(Math.abs(v)>=20?Math.round(v):Math.round(v*10)/10)}
function lineChart(pts,unit){
 if(!pts.length)return `<div class="nochart">No data yet. Log this exercise to see the chart.</div>`;
 const Wd=330,H=160,pl=6,pr=44,pt=12,pb=26;let x0=pts[0].x,x1=pts[pts.length-1].x;if(x1-x0<DAY*7){x0-=DAY*3.5;x1+=DAY*3.5}
 let y0=Math.min(...pts.map(p=>p.y)),y1=Math.max(...pts.map(p=>p.y));if(y1===y0){y0=y0*0.9;y1=y1*1.1||1}const padv=(y1-y0)*0.08;y0=Math.max(0,y0-padv);y1+=padv;
 const X=x=>pl+(Wd-pl-pr)*(x-x0)/(x1-x0),Y=y=>pt+(H-pt-pb)*(1-(y-y0)/(y1-y0));
 let s=`<svg class="chart" viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Progress chart"><line class="grid" x1="${pl}" x2="${Wd-pr}" y1="${pt}" y2="${pt}"/><line class="grid" x1="${pl}" x2="${Wd-pr}" y1="${H-pb}" y2="${H-pb}"/><text x="${Wd-pr+6}" y="${pt+4}">${niceFmt(y1,unit)}</text><text x="${Wd-pr+6}" y="${H-pb+4}">${niceFmt(y0,unit)}</text>`;
 const d=new Date(x0);d.setDate(1);d.setHours(0,0,0,0);d.setMonth(d.getMonth()+1);const months=[];while(d.getTime()<=x1){months.push(d.getTime());d.setMonth(d.getMonth()+1)}
 const step=Math.ceil(months.length/5)||1;months.forEach((m,i)=>{if(i%step)return;s+=`<text x="${X(m)}" y="${H-7}" text-anchor="middle" style="font-size:11px;letter-spacing:.4px">${new Date(m).toLocaleDateString('en-GB',{month:'short'}).toUpperCase()}</text>`});
 const path=pts.map((p,i)=>`${i?'L':'M'}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
 s+=`<path class="area" d="${path}L${X(pts[pts.length-1].x).toFixed(1)},${H-pb}L${X(pts[0].x).toFixed(1)},${H-pb}Z"/><path class="ln" d="${path}"/>`;
 pts.forEach((p,i)=>{s+=`<circle class="pt ${i===pts.length-1?'last':''}" cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3.6"><title>${fD(p.x)}: ${niceFmt(p.y,unit)}${unit&&unit!=='s'?' '+unit:''}</title></circle>`});
 return s+'</svg>';
}

function filterBar(f,ctx){return `<div class="search">${IC.search}<input id="q-${ctx}" data-q="${ctx}" placeholder="Search" value="${esc(f.q)}" autocomplete="off" autocorrect="off" enterkeyhint="search"></div>

function exList(f,o){
 const q=f.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
 let xs=allEx().filter(x=>(!f.bp||x.bp===f.bp)&&(!f.cat||x.cat===f.cat)&&q.every(t=>x.name.toLowerCase().includes(t)));

 if(f.sort==='freq'){xs=xs.map(x=>[x,sessions(x.id).length]).filter(a=>a[1]>0).sort((a,b)=>b[1]-a[1]||a[0].name.localeCompare(b[0].name)).map(a=>a[0]);groups=[['Most performed',xs]]}
 else if(f.sort==='recent'){xs=xs.map(x=>[x,(sessions(x.id)[0]||{w:{start:0}}).w.start]).filter(a=>a[1]>0).sort((a,b)=>b[1]-a[1]).map(a=>a[0]);groups=[['Recently performed',xs]]}
 else{xs.sort((a,b)=>a.name.localeCompare(b.name));const m=new Map();for(const x of xs){const L=/[a-z]/i.test(x.name[0])?x.name[0].toUpperCase():'#';if(!m.has(L))m.set(L,[]);m.get(L).push(x)}groups=[...m.entries()]}
 if(!xs.length)return `<div class="empty"><b>No exercises found</b>${f.sort!=='name'?'Nothing logged yet for this sort.':'Try another search, or tap “New” to create it.'}</div>`;
 let h='';
 for(const[L,arr]of groups){h+=`<div class="lsec" id="${o.ctx}-L-${L.length===1?L:'x'}">${esc(L)}</div>`;for(const x of arr){const on=sel.includes(x.id);const L1=(x.name.match(/[a-z]/i)||['?'])[0].toUpperCase();
  h+=`<div class="exrow ${on?'sel':''}" role="button" tabindex="0" data-act="${o.ctx==='tab'?'exInfo':'pickToggle'}" data-arg="${x.id}"><span class="thumb">${L1}${on?`<span class="ck">${IC.check}</span>`:''}</span><span class="exmid"><b>${esc(x.name)}</b><span class="sub"><span>${esc(x.bp)}</span><span>${esc(lastBest(x.id))}</span></span></span><button class="q" data-act="exInfo" data-arg="${x.id}" aria-label="About ${esc(x.name)}">?</button></div>`}}
 if(f.sort==='name'){const letters=groups.map(g=>g[0]);h=`<div class="azwrap"><div class="az" data-ctx="${o.ctx}">${'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(l=>`<span data-l="${l}" style="${letters.includes(l)?'':'opacity:.35'}">${l}</span>`).join('')}</div></div>`+h}
 return h;

function blockHTML(doc,i,mode){

 const gt=`grid-template-columns:30px minmax(0,1fr) ${cols.map(f=>f==='rir'?'40px':cmp?'54px':'62px').join(' ')} 36px`;
 const sg=mode==='active'&&S.profile.targets!==false?suggest(e.eid):null;if(sg)sg.eid=e.eid;const st=mode==='active'?plateau(e.eid):0;
 const prev=mode==='tpl'?prevSets(e.eid):prevSets(e.eid,mode==='edit'?doc.id:null);
 let nIdx=0;const run=S.timer&&mode==='active'?S.timer:null;
 let rows='';

/* ================= timer, sound, wake ================= */

function unlockAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}

function startTimer(sec,i,j){S.timer={end:Date.now()+sec*1000,total:sec,i,j};saveActiveNow();refreshTimerUI()}

function updateTimerBits(){
 document.querySelectorAll('.tbtn').forEach(b=>{b.className=`tbtn ${S.timer?'run':''}`;b.innerHTML=S.timer?`<span data-timer>${fDur(remain())}</span>`:IC.timer});
 const ws=S.ui.sheets.find(s=>s.type==='workout');if(!ws||!ws.el||!S.active)return;
 ws.el.querySelectorAll('.rest[data-j]').forEach(b=>{const i=+b.dataset.i,j=+b.dataset.j,e=S.active.ex[i];if(!e)return;const run=!!(S.timer&&S.timer.i===i&&S.timer.j===j);b.parentElement.classList.toggle('run',run);b.toggleAttribute('data-restrun',run);b.innerHTML=run?`<i style="--p:${remain()/S.timer.total}"></i><span>${fDur(remain())}</span>`:`<span>${fDur(e.rest)}</span>`});

let wake=null;

function tick(){const now=Date.now();
 document.querySelectorAll('[data-el]').forEach(el=>{el.textContent=fDur((now-+el.dataset.el)/1000)});
 if(S.timer){const rem=remain();document.querySelectorAll('[data-timer]').forEach(el=>el.textContent=fDur(rem));
  document.querySelectorAll('[data-restrun]').forEach(el=>{const i=el.querySelector('i'),s=el.querySelector('span');if(i)i.style.setProperty('--p',rem/S.timer.total);if(s)s.textContent=fDur(rem)});
  document.querySelectorAll('[data-ringp]').forEach(el=>{const C=+el.dataset.ringp;el.setAttribute('stroke-dashoffset',C*(1-rem/S.timer.total))});
  if(rem<=0){S.timer=null;beep();toast('Rest complete');saveActiveNow();refreshTimerUI()}}}
setInterval(tick,500);

function commitWorkout(completeAll){
 const a=S.active;const end=Date.now();
 const ex=a.ex.map(e=>{const k=kOf(e.eid);return{eid:e.eid,rest:e.rest,ss:e.ss||null,note:e.note||null,sets:e.sets.filter(s=>s.done||(completeAll&&setOK(k,s))).map(s=>({t:s.t,kg:s.kg,reps:s.reps,km:s.km,sec:s.sec,rir:s.rir??null}))}}).filter(e=>e.sets.length);
 if(!ex.length){toast('Nothing to save');return}
 const w={id:a.id,name:a.name.trim()||wname(a.start),start:a.start,end,notes:a.notes||null,tpl:a.tpl,ex};
 const k=mkey(w.start);S.months[k]=S.months[k]||{w:{}};S.months[k].w[w.id]=w;bump();Store.save('m:'+k);

 const tplNew=tpl&&{...tpl,ex:ex.map(e=>({eid:e.eid,rest:e.rest,ss:e.ss,note:e.note,sets:e.sets.map(s=>({...s}))}))};
 render();

 if(tpl&&sig(tpl)!==sig(tplNew)){setTimeout(()=>dlg({title:'Update template?',msg:`Save the sets, weights and reps from this workout to “${tpl.name}”?`,actions:[{label:'Update Template',style:'bold',fn:()=>{Object.assign(tpl,tplNew);Store.save('templates');showDone()}},{label:'Keep Original Template',fn:showDone}],onCancel:showDone}),350)}else setTimeout(showDone,300);

function cancelWorkout(force){const go=()=>{S.active=null;S.timer=null;saveActiveNow();wakeOff();const ws=S.ui.sheets.find(s=>s.type==='workout');if(ws)closeSheet(ws);render()};if(force){go();return}dlg({title:'Cancel workout?',msg:'All progress in this workout will be lost.',actions:[{label:'Cancel Workout',style:'red',fn:go}]})}
function warmupFor(e){const k=kOf(e.eid);const ws=e.sets.find(s=>s.t==='n'&&s.kg)||(prevSets(e.eid)||[]).find(s=>s.t!=='w'&&s.kg);if(!ws||k!=='wr')return null;const W0=ws.kg;const isBar=getEx(e.eid).cat==='Barbell';const r=v=>Math.floor(v/2.5)*2.5;const mn=isBar?20:0;
 const plan=W0<40?[[.5,8],[.75,4]]:[[.5,8],[.7,4],[.85,2]];return{base:W0,sets:plan.map(([p,reps])=>({kg:Math.max(mn,r(W0*p)),reps}))}}

/* ================= CSV import / export ================= */
function parseCSV(text){text=text.replace(/^﻿/,'');const first=text.split(/\r?\n/,1)[0]||'';const delim=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',';const rows=[];let row=[],f='',q=false;
 for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===delim){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}
 if(f!==''||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()!==''))}
function parseDate(s){const m=String(s).trim().match(/(\d{4})-(\d{1,2})-(\d{1,2})[ T](\d{1,2}):(\d{2})(?::(\d{2}))?/);if(m)return new Date(+m[1],m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0)).getTime();const t=Date.parse(s);return isNaN(t)?null:t}
function parseDurStr(s){s=String(s||'').trim();if(!s)return 0;if(/^\d+$/.test(s))return +s;let t=0;const h=s.match(/(\d+)\s*h/),m=s.match(/(\d+)\s*m(?!s)/),sec=s.match(/(\d+)\s*s/);if(h)t+=+h[1]*3600;if(m)t+=+m[1]*60;if(sec)t+=+sec[1];if(!h&&!m&&!sec&&s.includes(':'))t=parseDur(s)||0;return t}
function importStrong(text){
 const rows=parseCSV(text);if(rows.length<2)throw new Error('The file is empty.');
 const H=rows[0].map(h=>h.trim().toLowerCase().replace(/^"|"$/g,''));const col=(...ns)=>{for(const n of ns){const i=H.indexOf(n);if(i>=0)return i}return -1};
 const iD=col('date'),iN=col('workout name'),iDur=col('duration','duration (sec)','duration (seconds)'),iE=col('exercise name'),iO=col('set order'),iW=col('weight','weight (kg)','weight (lbs)','weight (lb)'),iWU=col('weight unit'),iR=col('reps'),iDi=col('distance','distance (km)','distance (meters)','distance (m)','distance (miles)'),iS=col('seconds'),iNo=col('notes'),iWN=col('workout notes'),iRPE=col('rpe');
 const wLbs=iW>=0&&/lb/.test(H[iW]),dM=iDi>=0&&/meter|\(m\)/.test(H[iDi]),dMi=iDi>=0&&/mile/.test(H[iDi]);
 if(iD<0||iE<0)throw new Error('This doesn’t look like a Strong export. It needs “Date” and “Exercise Name” columns.');
 const byName={};for(const x of allEx())byName[x.name.toLowerCase()]=x.id;
 const ws=new Map();let created=0,sets=0;
 for(const r of rows.slice(1)){const g=i=>i>=0?(r[i]||'').trim():'';const order=g(iO);if(/rest/i.test(order))continue;const start=parseDate(g(iD));if(start==null)continue;const ename=g(iE);if(!ename)continue;
  const key=start+'|'+g(iN);let w=ws.get(key);if(!w){w={id:'s'+start.toString(36),name:g(iN)||wname(start),start,end:start+parseDurStr(g(iDur))*1000,notes:g(iWN)||null,tpl:null,ex:[]};ws.set(key,w)}
  let eid=byName[ename.toLowerCase()];
  let kg=num(g(iW)),reps=num(g(iR)),km=num(g(iDi)),sec=num(g(iS));if(((iWU>=0&&/lb/i.test(g(iWU)))||wLbs)&&kg!=null)kg=Math.round(kg*0.45359237*100)/100;if(km!=null){if(dM)km=km/1000;else if(dMi)km=Math.round(km*1.609344*1000)/1000}
  if(!eid){eid='c-'+slug(ename);if(!S.custom.ex[eid]){S.custom.ex[eid]={name:ename,bp:'Other',cat:km?'Cardio':sec&&!reps?'Duration':kg?'Machine/Other':'Reps Only'};created++}byName[ename.toLowerCase()]=eid}
  let e=w.ex[w.ex.length-1];if(!e||e.eid!==eid){e={eid,rest:null,ss:null,note:g(iNo)||null,sets:[]};w.ex.push(e)}
  const t=/^w/i.test(order)?'w':/^d/i.test(order)?'d':/^f/i.test(order)?'f':/^l/i.test(order)?'l':'n';const rpe=num(g(iRPE));
  e.sets.push({t,kg:kg||kg===0?kg:null,reps:reps??null,km:km||null,sec:sec||null,rir:rpe?Math.max(0,10-rpe):null});sets++}

 const touchedM=new Set();for(const w of ws.values()){if(w.end<=w.start)w.end=w.start+3600000;const k=mkey(w.start);S.months[k]=S.months[k]||{w:{}};S.months[k].w[w.id]=w;touchedM.add(k)}
 bump();if(created)Store.save('custom');for(const k of touchedM)Store.save('m:'+k);
 return{workouts:ws.size,sets,created};
}
function exportCSV(){const H='Date,Workout Name,Duration,Exercise Name,Set Order,Weight,Reps,Distance,Seconds,Notes,Workout Notes,RPE';const q=v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v};const lines=[H];
 for(const w of [...W()].reverse()){const d=new Date(w.start);const ds=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;const dur=fHM(w.end-w.start);
  for(const e of w.ex){let n=0;for(const s of e.sets){const o=s.t==='n'?++n:s.t.toUpperCase();lines.push([ds,w.name,dur,getEx(e.eid).name,o,s.kg??0,s.reps??0,s.km??0,s.sec??0,e.note||'',w.notes||'',s.rir!=null?10-s.rir:''].map(q).join(','))}}}
 return lines.join('\n')}

SHEET.program=(sh)=>{const p=PROGRAMS.find(x=>x.id===sh.pid);if(!p)return null;const days=[];for(const d of p.days)for(let r=0;r<p.perWeek;r++)days.push(d);
 return{head:head(X,esc(p.name),''),body:`<p class="muted" style="margin:2px 0 6px">${p.freq}</p><p class="note" style="margin-top:0">${p.desc}</p>
 <h3>Workouts</h3>${p.days.map(d=>`<button class="setrow" data-act="viewTpl" data-arg="${d.id}"><span>${esc(d.name)}</span><span class="v">${d.ex.length} exercises</span></button>`).join('')}
 <p class="note">${p.sched}</p>
 <h3>Weekly sets per muscle</h3>${volBars(volMap(days))}
 <p class="note">Rep ranges, rest times and weight targets come from each exercise’s settings, so once you’ve logged an exercise, every session shows what to aim for next.</p>`,
 foot:`<button class="primary" data-act="addProgram" data-arg="${p.id}">Add ${p.days.length} Workouts to My Templates</button>`}};
SHEET.wvol=(sh)=>{const a=S.active;if(!a)return null;const sm=volMap([a]);const wk=weekVol('week');
 return{head:head(X,'Volume',''),body:`<h3 style="margin-top:4px">This session</h3>${volBars(sm,{sess:1,empty:'in this session'})}
 <h3>This week, including today</h3>${volBars(wk,{add:sm})}
 <p class="note">A hard set is any completed non-warm-up set that ended within about 4 reps of failure. Main muscles count 1 set and assisting muscles count ½.</p>`}};
ACT.guide=()=>openSheet('guide',{});
ACT.viewProgram=(el,a)=>openSheet('program',{pid:a});
ACT.addProgram=(el,a)=>{const p=PROGRAMS.find(x=>x.id===a);for(const d of p.days){const c=clone(d);c.id=gid();c.name=`${d.name}`;c.notes=`${p.name} program`;S.templates.push(c)}Store.save('templates');const sh=sheetOf(el);if(sh)closeSheet(sh);render();toast(`Added ${p.days.length} workouts to My Templates`)};
ACT.wvol=()=>openSheet('wvol',{});
ACT.volMode=(el,a)=>{S.ui.volMode=a;renderView()};
ACT.tgt=el=>{const c=rowCtx(el);const k=kOf(c.e.eid);const sg=suggest(c.e.eid);if(!sg)return;sg.eid=c.e.eid;
 const apply=()=>{for(const s of c.e.sets){if(s.done||!(s.t==='n'||s.t==='f'))continue;if(sg.kg!=null)s.kg=sg.kg;s.reps=sg.reps}touched(c.sh);repaintBlock(c.sh,c.i)};
 const acts=[{label:'Apply to remaining sets',style:'bold',fn:apply},{label:`Change rep range (${sg.lo}–${sg.hi})`,fn:()=>pickRepRange(c.e.eid)}];
 if(sg.deload){const n=c.e.sets.filter(s=>!s.done&&s.t!=='w').length;if(n>1)acts.splice(1,0,{label:'Deload: remove half the sets',fn:()=>{let rm=Math.floor(n/2);for(let j=c.e.sets.length-1;j>=0&&rm>0;j--){const s=c.e.sets[j];if(!s.done&&s.t!=='w'){c.e.sets.splice(j,1);rm--}}touched(c.sh);repaintBlock(c.sh,c.i)}})}
 acts.push({label:'How progression works',fn:()=>openSheet('guide',{})});
 dlg({title:tgtText(sg,k),msg:sg.why,actions:acts})};
ACT.stall=(el,a)=>{const n=plateau(a);dlg({title:`${getEx(a).name}: stalled`,msg:`Your estimated 1RM hasn’t improved for ${n} sessions. Things to try: check that sleep and food are on track, change the rep range, swap to a similar variation for a few weeks, or take a deload week if several lifts have stalled.`,actions:[{label:'Start a deload week',fn:()=>ACT.startDeload()},{label:'Change rep range',fn:()=>pickRepRange(a)},{label:'Open exercise history',fn:()=>openSheet('exdetail',{eid:a,tab:'charts'})}]})};
ACT.startDeload=()=>{S.profile.deloadUntil=weekShift(sod(Date.now()),1);Store.save('profile');render();toast('Deload week started')};
ACT.endDeload=()=>{S.profile.deloadUntil=0;Store.save('profile');render()};
ACT.snoozeDeload=()=>{S.profile.deloadSnooze=Date.now()+7*DAY;Store.save('profile');render()};
ACT.effortMode=()=>dlg({title:'Effort tracking',msg:'RIR (reps in reserve) is how many more reps you could have done. RPE is the same thing on a 1–10 scale: RPE 8 equals 2 RIR.',actions:[['rir','RIR (reps in reserve)'],['rpe','RPE (1–10)'],['off','Off']].map(([v,l])=>({label:l,check:S.profile.effort===v,fn:()=>{S.profile.effort=v;Store.save('profile');render()}}))});
ACT.volTarget=()=>dlg({title:'Weekly volume target',msg:'Hard sets per muscle per week. Most people grow well with 10–20. Beginners and maintenance phases need less.',actions:[[6,12,'Beginner or maintenance'],[10,20,'Most lifters'],[12,24,'Advanced, recovering well']].map(([a,b,l])=>({label:`${a}–${b} · ${l}`,check:S.profile.volMin===a&&S.profile.volMax===b,fn:()=>{S.profile.volMin=a;S.profile.volMax=b;Store.save('profile');render()}}))});
ACT.toggleTargets=()=>{S.profile.targets=S.profile.targets===false;Store.save('profile');render()};
ACT.repRangeX=(el,a)=>pickRepRange(a);
ACT.exMus=(el,a)=>{const sh=sheetOf(el);const v=sh.d.mus[a]||0;const nx=v===0?1:v===1?.5:0;if(nx)sh.d.mus[a]=nx;else delete sh.d.mus[a];repaint(sh)};

/* ================= events ================= */
document.addEventListener('click',e=>{unlockAudio();const el=e.target.closest('[data-act]');if(!el||el.disabled)return;if(el.closest('.swrap.open')&&!el.classList.contains('sdel')){closeSwipes();return}const fn=ACT[el.dataset.act];if(fn){e.preventDefault();fn(el,el.dataset.arg)}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button]')){e.preventDefault();e.target.click()}if(e.key==='Escape'){if(DLG)ACT.dlgClose();else if(topSheet())ACT.scrim()}
 if(e.key==='Enter'&&e.target.classList.contains('cell')){e.preventDefault();const cells=[...document.querySelectorAll('.sheet .cell')];const n=cells[cells.indexOf(e.target)+1];n?n.focus():e.target.blur()}});
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.q){const ctx=t.dataset.q;if(ctx==='tab'){S.ui.ex.q=t.value;$('#exl-tab').innerHTML=exList(S.ui.ex,{ctx:'tab'})}else{const sh=sheetOf(t);sh.f.q=t.value;sh.el.querySelector('#exl-pick').innerHTML=exList(sh.f,{ctx:'pick',sel:sh.sel})}return}
 if(t.id==='tq'){S.ui.tq=t.value;const v=$('#views');const keep=t.selectionStart;v.innerHTML=VIEWS.start();const n=$('#tq');n.focus();try{n.setSelectionRange(keep,keep)}catch(x){}return}
 const f=t.dataset.f;if(!f)return;const sh=sheetOf(t);
 if(f==='pname'){S.profile.name=t.value;clearTimeout(t._t);t._t=setTimeout(()=>{Store.save('profile');if(S.ui.tab==='profile')renderView()},500);return}
 if(f==='exnotes'){S.custom.notes[t.dataset.arg]=t.value;clearTimeout(t._t);t._t=setTimeout(()=>Store.save('custom'),600);return}
 if(f==='bw'){sh.bw=num(t.value);clearTimeout(t._t);t._t=setTimeout(()=>{const pos=t.selectionStart;repaint(sh);const n=sh.el.querySelector('#bw');n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}},600);return}
 if(f==='exname'){sh.d.name=t.value;return}if(f==='exins'){sh.d.ins=t.value;return}
 if(f==='plkg'){sh.kg=num(t.value);clearTimeout(t._t);t._t=setTimeout(()=>{const pos=t.selectionStart;repaint(sh);const n=sh.el.querySelector('#plkg');n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}},500);return}
 const doc=sh&&docOf(sh);if(!doc)return;
 if(f==='wname'){doc.name=t.value;touched(sh);if(sh.type==='workout')renderMini();return}
 if(f==='wnotes'){doc.notes=t.value;touched(sh);return}
 if(f==='exnote'){doc.ex[+t.dataset.i].note=t.value;touched(sh);return}
 const row=t.closest('.srow');if(!row)return;const s=doc.ex[+row.dataset.i].sets[+row.dataset.j];
 if(f==='sec')s.sec=parseDur(t.value);else if(f==='rir'){const v=num(t.value);s.rir=v==null?null:Math.max(0,Math.min(10,S.profile.effort==='rpe'?10-v:v))}else s[f]=num(t.value);touched(sh)});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='jsonfile'&&t.files[0]){const rd=new FileReader();rd.onload=()=>{try{restoreBackup(JSON.parse(String(rd.result)))}catch(err){dlg({title:'Restore failed',msg:err.message||String(err),actions:[]})}};rd.readAsText(t.files[0]);return}if(t.id==='csvfile'&&t.files[0]){const file=t.files[0];const rd=new FileReader();rd.onload=()=>{try{const r=importStrong(String(rd.result));render();toast(`Imported ${r.workouts} workouts (${r.sets} sets)`);if(S.ui.tab!=='history'){S.ui.tab='history';render()}}catch(err){dlg({title:'Import failed',msg:err.message||String(err),actions:[]})}};rd.readAsText(file);return}
 if(t.dataset.f==='sec'){const sh=sheetOf(t);const row=t.closest('.srow');if(sh&&row){const s=docOf(sh).ex[+row.dataset.i].sets[+row.dataset.j];t.value=s.sec!=null?fDur(s.sec):''}}});
document.addEventListener('focusin',e=>{if(e.target.classList.contains('cell'))setTimeout(()=>{try{e.target.select()}catch(x){}},0)});

/* swipe to delete sets */
let sw=null;
function closeSwipes(except){document.querySelectorAll('.swrap.open').forEach(w=>{if(w!==except){w.classList.remove('open');w.querySelector('.srow').style.transform=''}})}
document.addEventListener('touchstart',e=>{const t=e.target;if(!t.closest('.sdel'))closeSwipes(t.closest('.swrap'));const r=t.closest('.srow');if(r){sw={r,x:e.touches[0].clientX,y:e.touches[0].clientY,dx:0,lock:null,base:r.parentElement.classList.contains('open')?-84:0}}
 const g=t.closest('[data-grab],.sheet .wbar');if(g&&!t.closest('button')){const sh=sheetOf(g);if(sh&&sh.type==='workout')drag={sh,y:e.touches[0].clientY,dy:0}}},{passive:true});
let drag=null;
document.addEventListener('touchmove',e=>{if(sw){const dx=e.touches[0].clientX-sw.x,dy=e.touches[0].clientY-sw.y;if(!sw.lock){if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy))sw.lock='x';else if(Math.abs(dy)>8)sw.lock='y'}if(sw.lock==='x'){sw.dx=dx;sw.r.parentElement.classList.add('sw');const v=Math.min(0,Math.max(-110,sw.base+dx));sw.r.style.transition='none';sw.r.style.transform=`translateX(${v}px)`}}
 if(drag){drag.dy=Math.max(0,e.touches[0].clientY-drag.y);drag.sh.el.style.transition='none';drag.sh.el.style.transform=`translateY(${drag.dy}px)`}},{passive:true});
document.addEventListener('touchend',()=>{if(sw&&sw.lock==='x'){const v=sw.base+sw.dx;sw.r.style.transition='';const w=sw.r.parentElement;w.classList.remove('sw');if(v<-50){w.classList.add('open');sw.r.style.transform='translateX(-84px)'}else{w.classList.remove('open');sw.r.style.transform=''}}sw=null;
 if(drag){const d=drag;drag=null;d.sh.el.style.transition='';d.sh.el.style.transform='';if(d.dy>90)closeSheet(d.sh)}});
/* A–Z index */
function azJump(e){const az=e.currentTarget||e.target.closest('.az');const p=e.touches?e.touches[0]:e;const el=document.elementFromPoint(az.getBoundingClientRect().left+11,p.clientY);const L=el&&el.dataset&&el.dataset.l;if(!L)return;const ctx=az.dataset.ctx;const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ';for(let i=letters.indexOf(L);i<letters.length;i++){const s=document.getElementById(`${ctx}-L-${letters[i]}`);if(s){const sc=s.closest('.sh-body')||$('#views');const top=s.getBoundingClientRect().top-sc.getBoundingClientRect().top+sc.scrollTop;const off=ctx==='tab'?($('.exhead')?$('.exhead').offsetHeight-6:0):0;sc.scrollTop=top-off;break}}}
document.addEventListener('touchstart',e=>{const az=e.target.closest('.az');if(az){e.preventDefault();azJump({currentTarget:az,touches:e.touches})}},{passive:false});
document.addEventListener('touchmove',e=>{const az=e.target.closest('.az');if(az){e.preventDefault();azJump({currentTarget:az,touches:e.touches})}},{passive:false});
document.addEventListener('mousedown',e=>{const az=e.target.closest('.az');if(az)azJump({currentTarget:az,clientY:e.clientY,target:e.target})});
window.addEventListener('beforeunload',()=>{Store.mirrorNow()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')Store.mirrorNow()});
window.addEventListener('pagehide',()=>{Store.mirrorNow()});

/* ================= boot ================= */
async function boot(){
 Store.load('local');render();if(await Store.loadAsync('local'))render();
 const embedded=window.top!==window;if(!embedded&&navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
 let tries=0;while(embedded&&!(window.claude&&typeof window.claude.use==='function')&&tries<20){await new Promise(r=>setTimeout(r,100));tries++}
 if(!(window.claude&&typeof window.claude.use==='function')){setSync();return}
 let db=null,user=null;try{[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')])}catch(e){}
 window.claude.use('downloads').then(d=>{S.dl=d}).catch(()=>{});
 let uid=null;if(user){try{uid=await user.id();S.owner=await user.isOwner();const me=await user.me();S.meName=me.name||'';S.meAvatar=me.avatarUrl||''}catch(e){}}
 if(!db||!uid){setSync();render();return}
 S.uid=uid;Store.db=db;Store.base='data/users/'+uid;
 const had=await Store.loadAsync(uid);
 if(!had){/* adopt anything logged while signed out on this device */Store.load('local');S.u={templates:S.templates.length?1:0,profile:0,custom:Object.keys(S.custom.ex).length?1:0,active:S.active?1:0};}
 S.mode='db';render();if(S.active)wakeOn();
 let seed=null;if(S.owner){try{const s=await db.doc('seed/owner').get();if(s.exists)seed=s.data()}catch(e){}}
 subscribe(seed);
}
boot();
</script>

<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
